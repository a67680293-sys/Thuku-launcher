name: Build Thuku Launcher APK

run-name: Build APK (${{ github.ref_name }})

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: thuku-android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test and package APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      # v4 avoids the retired Android SDK 'tools' package requested by v3.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"
          log-accepted-android-sdk-licenses: false

      - name: Install required Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - name: Validate project layout
        shell: bash
        run: |
          set -euo pipefail
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/thuku/launcher/MainActivity.kt
          test -f .github/workflows/android.yml

      - name: Run static project checks
        run: python3 tools/verify_source.py

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.13"
          cache-provider: basic

      - name: Run unit tests and build installable debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace --warning-mode all clean testDebugUnitTest assembleDebug

      # Lint reports are retained even if there are advisory findings; actual compilation/tests remain blocking.
      - name: Run Android lint
        continue-on-error: true
        shell: bash
        run: gradle --no-daemon --stacktrace lintDebug

      - name: Verify and prepare APK downloads
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          mkdir -p release-files
          cp "$APK" release-files/ThukuLauncher-debug.apk
          sha256sum release-files/ThukuLauncher-debug.apk > release-files/SHA256SUMS.txt
          {
            echo "App: Thuku Launcher"
            echo "Version: $(grep -o 'versionName = "[^"]*"' app/build.gradle.kts | cut -d '"' -f2)"
            echo "Commit: ${GITHUB_SHA}"
            echo "Branch/ref: ${GITHUB_REF_NAME}"
            echo "Build type: debug (Android-debug-signed, for testing/sideloading)"
            echo "Built at UTC: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          } > release-files/BUILD-INFO.txt

      - name: Upload APK and checksums
        uses: actions/upload-artifact@v7
        with:
          name: ThukuLauncher-APK-${{ github.run_number }}
          path: release-files/
          if-no-files-found: error
          retention-days: 30
          overwrite: true

      - name: Upload build diagnostics when the job fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ThukuLauncher-build-diagnostics-${{ github.run_number }}
          path: |
            app/build/reports/**
            app/build/outputs/logs/**
            app/build/test-results/**
          if-no-files-found: warn
          retention-days: 14

  publish-release:
    name: Publish APK to GitHub Releases
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download APK artifact from successful build
        uses: actions/download-artifact@v8
        with:
          name: ThukuLauncher-APK-${{ github.run_number }}
          path: release-files

      - name: Publish or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          APK="release-files/ThukuLauncher-debug.apk"
          test -s "$APK"
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" "$APK#Thuku Launcher APK" "release-files/SHA256SUMS.txt#SHA256 checksum" --clobber
          else
            gh release create "$TAG_NAME" "$APK#Thuku Launcher APK" "release-files/SHA256SUMS.txt#SHA256 checksum" \
              --title "Thuku Launcher $TAG_NAME" \
              --generate-notes \
              --notes "Installable debug build for testing. A release signing key has not been configured in this repository, so this is not a Play Store production build."
          fi
