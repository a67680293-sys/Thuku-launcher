name: Bug report
description: Report a reproducible issue with Thuku Launcher.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Please avoid sharing personal data or complete crash logs containing private information."
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: input
    id: android
    attributes:
      label: Android version
      placeholder: "Android 14"
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device model
      placeholder: "Phone model"
    validations:
      required: false
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open ... 2. Tap ..."
    validations:
      required: true
