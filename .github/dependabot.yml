version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      # AndroidX Core 1.19.x requires AGP 9.1; this project is intentionally pinned to AGP 8.13.2.
      - dependency-name: "androidx.core:core-ktx"
        versions: [">=1.19.0"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
